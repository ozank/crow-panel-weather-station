; CrowPanel ESP32-S3 2.13" e-paper weather station
; Board: ESP32-S3, 8 MB flash, CH340K USB-serial bridge on the Type-C port.

[env:crowpanel213]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    adafruit/Adafruit GFX Library@^1.11.11
    bblanchon/ArduinoJson@^7.2.0

build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; Force a panel driver instead of auto-detecting it:
    ;   -DPANEL_DRIVER=1   SSD1680 (older boards)
    ;   -DPANEL_DRIVER=2   JD79661 (newer boards)
